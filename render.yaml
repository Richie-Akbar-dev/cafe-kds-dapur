services:
  - type: web
    name: fnb-dapur
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fnb-postgres
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: fnb-postgres
          property: connectionString
